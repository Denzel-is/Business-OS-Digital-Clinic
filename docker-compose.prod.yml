name: business-os-digital-clinic-production

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-business_os}
      POSTGRES_USER: ${DATABASE_USER:-business_os_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - data
    stop_grace_period: 60s

  redis:
    image: redis:7.4-alpine
    restart: always
    entrypoint: ["sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./infrastructure/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - data
    stop_grace_period: 30s

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable backend image reference}
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: production
      BACKEND_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-business_os}
      DATABASE_USER: ${DATABASE_USER:-business_os_app}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      CORS_ALLOWED_ORIGINS: ${FRONTEND_PUBLIC_URL:?Set FRONTEND_PUBLIC_URL}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_KEY_SALT_FILE: /run/secrets/rate_limit_key_salt
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      TURNSTILE_SECRET_KEY_FILE: /run/secrets/turnstile_secret
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:?Set TURNSTILE_EXPECTED_HOSTNAME}
      UPLOAD_DIRECTORY: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - database_password
      - redis_password
      - rate_limit_key_salt
      - turnstile_secret
    volumes:
      - backend_uploads:/app/uploads
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - app
      - data
    stop_grace_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable frontend image reference}
    restart: always
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BACKEND_PUBLIC_URL: http://backend:8080
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app
      - edge
    stop_grace_period: 20s

secrets:
  database_password:
    file: ${DATABASE_PASSWORD_FILE:?Set DATABASE_PASSWORD_FILE to a protected file outside Git}
  rate_limit_key_salt:
    file: ${RATE_LIMIT_KEY_SALT_FILE:?Set RATE_LIMIT_KEY_SALT_FILE to a protected file outside Git}
  redis_password:
    file: ${REDIS_PASSWORD_FILE:?Set REDIS_PASSWORD_FILE to a protected file outside Git}
  turnstile_secret:
    file: ${TURNSTILE_SECRET_KEY_FILE:?Set TURNSTILE_SECRET_KEY_FILE to a protected file outside Git}

volumes:
  backend_uploads:
  postgres_data:
  redis_data:

networks:
  app:
    internal: true
  data:
    internal: true
  edge:
