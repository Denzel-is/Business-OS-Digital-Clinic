spring:
  datasource:
    url: jdbc:h2:mem:businessos;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  main:
    banner-mode: off

management:
  health:
    redis:
      enabled: false

logging:
  level:
    root: WARN
