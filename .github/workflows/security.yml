name: Security

on:
  pull_request:
  push:
    branches: ["master"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$GITLEAKS_IMAGE" \
            detect --source=/workspace --redact --no-banner

      - name: Scan backend dependencies
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/backend:/workspace:ro" \
            --volume trivy-repository-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" \
            fs --exit-code 1 --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            /workspace

      - name: Scan frontend dependencies
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/frontend:/workspace:ro" \
            --volume trivy-repository-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" \
            fs --exit-code 1 --ignore-unfixed \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            /workspace

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build --tag business-os-backend:security ./backend

      - name: Build frontend image
        run: docker build --tag business-os-frontend:security ./frontend

      - name: Scan backend image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-container-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed \
            --pkg-types os \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            business-os-backend:security

      - name: Scan frontend image
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-container-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" \
            image --exit-code 1 --ignore-unfixed \
            --pkg-types os \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            business-os-frontend:security
